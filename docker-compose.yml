services:
  postgres:
    image: postgres:16-alpine
    container_name: aurex-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurex_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aurex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurex} -d ${POSTGRES_DB:-aurex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aurex-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: aurex-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-change-me-in-production-0123456789}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aurex}:${POSTGRES_PASSWORD:-aurex_dev_password}@postgres:5432/${POSTGRES_DB:-aurex}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@aurex.ai}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-ChangeMe!2026}
      DEFAULT_PAPER_BALANCE: ${DEFAULT_PAPER_BALANCE:-100000}
      BASE_CURRENCY: ${BASE_CURRENCY:-GBP}
      LIVE_TRADING_ENABLED: "false"
      REAL_MONEY_ENABLED: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: aurex-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
