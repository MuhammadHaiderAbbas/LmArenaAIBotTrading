# Render blueprint — deploys the AUREX AI API and a managed Postgres.
# Import this file from the Render dashboard ("New > Blueprint").
services:
  - type: web
    name: aurex-ai-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aurex-ai-db
          property: connectionString
      - key: FIRST_ADMIN_EMAIL
        sync: false
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_PAPER_BALANCE
        value: "100000"
      - key: BASE_CURRENCY
        value: GBP
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: REAL_MONEY_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: https://muhammadhaiderabbas.github.io

databases:
  - name: aurex-ai-db
    plan: free
    databaseName: aurex
    user: aurex
